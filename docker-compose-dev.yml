services:
  gpu_traefik:
    image: traefik:v2.11
    container_name: gpu_traefik_dev
    command:
      - "--entrypoints.web.address=:8001"
      - "--providers.docker=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "8001:8001"     # Acceso a la app vía Traefik
      - "8080:8080"     # Dashboard (opcional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gpu_traefik_dev
    extra_hosts:
      - "hulk:192.168.40.6"
      - "spiderman:192.168.40.10"
      - "piquin:192.168.40.23"
      - "mazinger:192.168.40.7"
      - "redis.reputacion.digital:192.168.40.5"
      - "elastic.reputacion.digital:192.168.40.26"
      - "dev.elastic.reputacion.digital:192.168.40.6"
      - "logs.reputacion.digital:192.168.40.24"
      - "ingest.reputacion.digital:192.168.40.27"
      - "dev.reports.reputacion.digital:192.168.40.6"
      - "reports.reputacion.digital:192.168.40.23"
      - "minio.reputacion.digital:192.168.40.4"
      - "manager.reputacion.digital:192.168.40.4"

  gpu_full_1:
    image: registry.reputacion.digital/gpu_reports:${IMAGE_VERSION}
    container_name: gpu_full_1
    networks:
      - gpu_traefik_dev
    expose:
      - "8002"
    environment:
      CONFIG_TYPE: "gpu_full_1"
    volumes:
      - ./.env:/app/.env
      - ./models:/app/models
      - ./config.yml:/app/config.yml
    logging:
      driver: gelf
      options:
         gelf-address: "udp://${GELF_IP:-gelf.reputacion.digital}:${GELF_PORT:-12202}"
         tag: ${GELF_TAG}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.full.rule=PathPrefix(`/`)"
      - "traefik.http.routers.full.entrypoints=web"
      - "traefik.http.services.full.loadbalancer.server.port=8002"

networks:
  gpu_traefik_dev:
    driver: bridge
