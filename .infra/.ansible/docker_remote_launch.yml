---
- hosts: "{{ server_name }}"
  vars_files:
    - cred.yml

  tasks:
    - name: log into docker hub registry
      docker_login:
        username: "{{ docker_user }}"
        password: "{{ docker_pswd }}"
        registry_url: "{{ docker_registry }}"

    # # ###############################################################

  
    - name: Creates project directory
      file:
        path: /opt/deploy/{{ folder_name }}/{{ item }}
        state: directory
      loop:
        - "models"
    
    - name: Copy configuration files
      block:
      - name: copy_file_docker-compose
        ansible.builtin.copy:
          src: ../../docker-compose.yml
          dest: /opt/deploy/{{ folder_name }}/docker-compose.yml
          owner: ansible_data_science
          group: deploy
          mode: "0664"

      - name: copy_file_env
        ansible.builtin.copy:
          src: ../../.env
          dest: /opt/deploy/{{ folder_name }}/.env
          owner: ansible_data_science
          group: deploy
          mode: "0664"
      
      - name: copy_file_config
        ansible.builtin.copy:
          src: ../../config.yml
          dest: /opt/deploy/{{ folder_name }}/config.yml
          owner: ansible_data_science
          group: deploy
          mode: "0664"
  
  # # ###############################################################

    - name: Tear down existing services
      community.docker.docker_compose_v2:
        project_src: /opt/deploy/{{ folder_name }}/
        state: absent
        remove_orphans: true

    - name: Create and start services
      community.docker.docker_compose_v2:
        project_src: /opt/deploy/{{ folder_name }}/
        pull: always
      register: output

    - name: Run `docker-compose up` again
      community.docker.docker_compose_v2:
        project_src: /opt/deploy/{{ folder_name }}/
        pull: never
      register: output

